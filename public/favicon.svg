<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff0033" />
      <stop offset="100%" stop-color="#cc0029" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="256" y1="180" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f0f0" />
    </linearGradient>
    <filter id="shadow" x="50" y="50" width="412" height="412" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Subtle inner border -->
  <rect x="34" y="34" width="444" height="444" rx="110" stroke="rgba(255,255,255,0.2)" stroke-width="4" />

  <!-- Download Arrow & Tray Motif -->
  <!-- Downward Arrow -->
  <path d="M256 140 V 300 M 180 235 L 256 310 L 332 235" 
        stroke="url(#arrowGrad)" 
        stroke-width="36" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  
  <!-- Bottom Tray / Dish -->
  <path d="M150 350 H 362" 
        stroke="url(#arrowGrad)" 
        stroke-width="36" 
        stroke-linecap="round" />
</svg>
